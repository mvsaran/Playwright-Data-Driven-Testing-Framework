# ============================================================
# SauceDemo Login Test Data — Java-style .properties format
#
# Format: <prefix>.<field> = <value>
#   Each unique prefix groups one complete test case.
#   Prefix order in this file determines the execution order.
#
# How to use:
#   $env:DATA_SOURCE = "properties"
#   npm test
# ============================================================

# ── TC_LOGIN_001 — Happy path ────────────────────────────────
TC_LOGIN_001.testCaseId    = TC_LOGIN_001
TC_LOGIN_001.testCaseName  = Valid standard user login
TC_LOGIN_001.username      = standard_user
TC_LOGIN_001.password      = secret_sauce
TC_LOGIN_001.expectedResult = success

# ── TC_LOGIN_002 — Invalid username ──────────────────────────
TC_LOGIN_002.testCaseId    = TC_LOGIN_002
TC_LOGIN_002.testCaseName  = Invalid username
TC_LOGIN_002.username      = invalid_user
TC_LOGIN_002.password      = secret_sauce
TC_LOGIN_002.expectedResult = failure

# ── TC_LOGIN_003 — Invalid password ──────────────────────────
TC_LOGIN_003.testCaseId    = TC_LOGIN_003
TC_LOGIN_003.testCaseName  = Invalid password
TC_LOGIN_003.username      = standard_user
TC_LOGIN_003.password      = wrong_password
TC_LOGIN_003.expectedResult = failure

# ── TC_LOGIN_004 — Empty username (boundary) ─────────────────
TC_LOGIN_004.testCaseId    = TC_LOGIN_004
TC_LOGIN_004.testCaseName  = Empty username
TC_LOGIN_004.username      =
TC_LOGIN_004.password      = secret_sauce
TC_LOGIN_004.expectedResult = failure

# ── TC_LOGIN_005 — Empty password (boundary) ─────────────────
TC_LOGIN_005.testCaseId    = TC_LOGIN_005
TC_LOGIN_005.testCaseName  = Empty password
TC_LOGIN_005.username      = standard_user
TC_LOGIN_005.password      =
TC_LOGIN_005.expectedResult = failure
